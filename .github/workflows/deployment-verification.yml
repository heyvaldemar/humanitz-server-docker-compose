name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily: a LinuxGSM rebuild or a HumanitZ patch should be met within a day.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime: single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: humanitz-server
            env_var: HUMANITZ_SERVER_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" humanitz-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, so a red run
          # means a scanner that died, not a new CVE upstream.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  decisions:
    name: The refresh, the status, the backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            update.sh scripts/*.sh tests/*.sh

      - name: The refresh restarts only an empty server, and silence is not empty
        # A stand-in answers RCON the way HumanitZ does, in CRLF, with players,
        # with nobody, or not at all, and prints LinuxGSM's build lines. Players
        # on and silence must both leave it untouched, and silence must exit 1;
        # the status says Unknown, never Online with 0.
        run: ./tests/e2e-decisions.sh

      - name: A world and its ban list go out and come back to the path the server reads
        # By path and by byte, the archive mode 600, nothing one level too
        # deep, what was there kept aside, the refusals leaving it untouched.
        run: ./tests/e2e-backup-restore.sh

      - name: No password in the log behind scripts/start.sh, and a stop is still LinuxGSM's
        # The pinned image, no game: LinuxGSM's details prints an
        # AdminPassword from the settings file through the image's own
        # entrypoint, and nothing behind start.sh; docker stop runs
        # LinuxGSM's stop, exit 0.
        run: ./tests/e2e-start.sh

      - name: A start does not wait for an npm registry that never answers
        # The pinned image's own npm and the module LinuxGSM installs: done in
        # seconds with the compose file's NPM_CONFIG_* settings, still waiting
        # at ninety with npm's defaults.
        run: ./tests/e2e-npm.sh

      - name: The compose file parses with the shipped defaults
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f humanitz-server-docker-compose.yml config >/dev/null
          echo "compose OK"

  game:
    name: The real server, from an empty volume
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: An .env with throwaway passwords
        # tests/secret-probe.sh plant: a random value for every password the
        # compose file passes (join, admin, RCON), written by awk through its
        # environment, never on a command line, masked in the log, and kept in
        # a values file the probe searches for later; gone with the runner.
        run: |
          sed -E -e "s/^HUMANITZ_SERVER_NAME=.*/HUMANITZ_SERVER_NAME=CI HumanitZ | verification/" \
                 -e "s/^HUMANITZ_MAX_PLAYERS=.*/HUMANITZ_MAX_PLAYERS=8/" .env.example > .env
          PROBE_PROJECT=humanitz tests/secret-probe.sh plant
          grep -cE '^HUMANITZ_(SERVER|ADMIN|RCON)_PASSWORD=p[0-9a-f]{20}$' .env

      - name: Docker 29.4.2 answers socketcall with ENOSYS; give its daemon the profile 29.4.3 ships
        # Docker Engine 29.4.2, and that release alone, blocks the 32-bit
        # socketcall(2) system call in its default seccomp profile
        # (moby/moby#52506). SteamCMD, a 32-bit program, makes every socket
        # through it, so on 29.4.2 it cannot get online, with Steam and the
        # network both up. 29.4.3 reverted the rule; the ubuntu-26.04 runner
        # image still ships 29.4.2. On that version, and only there, the daemon
        # gets the default profile 29.4.3 ships (moby/profiles seccomp v0.2.3),
        # pinned by commit and checksum. Measured: tf2-server-docker-compose run
        # 42496129688.
        run: |
          v="$(docker version --format '{{.Server.Version}}')"
          if [ "$v" != 29.4.2 ]; then echo "Docker $v: its own profile allows socketcall"; exit 0; fi
          sudo curl -fsSL -o /etc/docker/seccomp-29.4.3.json \
            https://raw.githubusercontent.com/moby/profiles/836ae4d37ef2ec995c77c99fc55f5b5f3af3a897/seccomp/default.json
          echo "536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  /etc/docker/seccomp-29.4.3.json" | sha256sum -c -
          f=/etc/docker/daemon.json
          [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"seccomp-profile": "/etc/docker/seccomp-29.4.3.json"}' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker
          docker info --format '{{.SecurityOptions}}'

      - name: Install, start, settings, RCON, status, a ban, backup and restore, the health check
        # On a failure the test prints the server's own log before removing it.
        # The secret probe after the first start, while the backup runs and
        # after a restart; the stop measured (tests/clean-stop.sh).
        run: ./tests/e2e-game.sh

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/secret-probe.values" .env
